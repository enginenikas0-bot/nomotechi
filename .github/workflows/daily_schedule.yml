name: Daily News Scraper

on:
  schedule:
    # Ώρες UTC (06:00 UTC = 08:00 GR, κλπ)
    - cron: '0 6,8,11,13,16,19 * * *'
    - cron: '30 21 * * *'
  
  # Κουμπί για να το τρέχεις χειροκίνητα όποτε θες
  workflow_dispatch:

jobs:
  run-autobot:
    runs-on: ubuntu-latest

    steps:
    # 1. Κατέβασε τον κώδικα του site
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Ετοίμασε την Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Εγκατάσταση βιβλιοθηκών (Απαραίτητο για να μην βγάζει error)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Τρέξε το Bot (ΣΩΣΤΟ ΟΝΟΜΑ ΑΡΧΕΙΟΥ)
    - name: Run Scraper
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: python auto_bot.py
