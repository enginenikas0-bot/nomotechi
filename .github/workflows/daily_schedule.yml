name: Daily News Scraper

on:
  schedule:
    - cron: '0 6,8,11,13,16,19 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  run-autobot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser gspread google-genai beautifulsoup4 requests python-dateutil urllib3

      - name: Run Scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python auto_bot.py
