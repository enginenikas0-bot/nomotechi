name: Daily News Scraper

on:
  schedule:
    # Ώρες UTC (06:00 UTC = 08:00 GR, κλπ)
    - cron: '0 6,8,11,13,16,19 * * *'
    - cron: '30 21 * * *'
  
  # Επιτρέπει χειροκίνητη εκτέλεση από το κουμπί "Run workflow"
  workflow_dispatch:

jobs:
  run-autobot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser gspread google-genai beautifulsoup4 requests python-dateutil

      - name: Run Scraper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python auto_bot.py
