name: Daily News Scan

on:
  schedule:
    # Τρέχει κάθε 2 ώρες περίπου (παράδειγμα)
    - cron: '0 8,10,13,15,18,21 * * *' 
  workflow_dispatch: # Επιτρέπει και το χειροκίνητο κουμπί

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python auto_bot.py
